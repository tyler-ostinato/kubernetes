apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mood-lighting
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tostinat/mood-lighting
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
