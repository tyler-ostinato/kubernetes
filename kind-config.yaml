kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    extraMounts:
      # Required for qbittorrent/sonarr/radarr data PV (hostPath: /mnt/seagate_2tb/media_server/data)
      - hostPath: /mnt/seagate_2tb/media_server/data
        containerPath: /mnt/seagate_2tb/media_server/data
      # Entire development directory — all app configs/ folders are accessible without
      # needing per-app entries here. Adding a new app never requires a cluster reset.
      - hostPath: /home/tostinat/development
        containerPath: /home/tostinat/development
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
      endpoint = ["http://kind-registry:5000"]
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    allowedUnsafeSysctls:
      - "net.ipv6.conf.all.disable_ipv6"
